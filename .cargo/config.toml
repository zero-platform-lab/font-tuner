# Statically link the MSVC CRT. MTBootStrap64.dll is injected into arbitrary
# child processes; a dynamic VCRUNTIME140.dll dependency would be resolved via
# the *target* process's DLL search path, giving an attacker a hijack surface
# (plant VCRUNTIME140.dll next to a process that runs from a writable dir).
# Static CRT makes the injected DLL self-contained (only kernel32/ntdll/apisets).
# Applies to the whole workspace; font-tuner.exe simply becomes self-contained too.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
