[package]
name = "injector"
version = "0.1.0"
edition = "2021"
description = "Inject a DLL into a target process (by exe name) via LoadLibraryW"
license = "GPL-3.0-or-later"

[[bin]]
name = "injector"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_System_Memory",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
]
