# Measurement harness for the Direct2D path: draws text through an
# ID2D1DCRenderTarget bound to a memory bitmap (the setup Scintilla's
# DirectWrite-DC mode uses) and reports where the ink landed, so the port can
# be compared against plain Direct2D.
#
# Its own workspace: never built by the shipped `cargo build` or build-msi.ps1.
[workspace]

[package]
name = "d2d-probe"
version = "0.0.0"
edition = "2021"
license = "GPL-3.0-only"
publish = false

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
]

[dependencies]
windows-core = "0.62"
windows-numerics = "0.3"

[profile.release]
opt-level = "s"
