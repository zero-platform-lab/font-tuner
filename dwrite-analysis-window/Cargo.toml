[package]
name = "dwrite-analysis-window"
version = "0.1.0"
edition = "2021"
description = "Win32 window drawing text via IDWriteGlyphRunAnalysis (Chromium/Skia-style) — injection target"
license = "GPL-3.0-only"

[[bin]]
name = "dwrite-analysis-window"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_DirectWrite",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
]
