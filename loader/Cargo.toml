[package]
name = "loader"
version = "0.1.0"
edition = "2021"
description = "Install a global WH_GETMESSAGE hook backed by RenderCore64.dll (auto-injection)"
license = "GPL-3.0-only"

[[bin]]
name = "loader"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]

# Lints that catch C++ habits Rust can do without: `as` casts that silently
# truncate or drop the sign, `&x as *const _` and pointer-to-pointer `as`
# chains, unsafe fns whose whole body is treated as unsafe, unsafe blocks
# with no SAFETY note. check-lint.ps1 runs clippy and fails when a crate's
# warning count rises above clippy-baseline.txt; lower the baseline as the
# count drops.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic noise that says nothing about C++ habits
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
# beyond pedantic
undocumented_unsafe_blocks = "warn"
significant_drop_tightening = "warn"
