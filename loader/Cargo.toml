[package]
name = "loader"
version = "0.1.0"
edition = "2021"
description = "Install a global WH_GETMESSAGE hook backed by RenderCore64.dll (auto-injection)"
license = "GPL-3.0-or-later"

[[bin]]
name = "loader"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_LibraryLoader",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
]
