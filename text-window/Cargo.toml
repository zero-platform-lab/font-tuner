[package]
name = "text-window"
version = "0.1.0"
edition = "2021"
description = "A tiny Win32 window that draws text via ExtTextOutW (injection target)"
license = "GPL-3.0-or-later"

[[bin]]
name = "text-window"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_LibraryLoader",
]
