[package]
name = "dwrite-probe"
version = "0.1.0"
edition = "2021"
description = "Stage 5a: intercept DirectWrite IDWriteBitmapRenderTarget::DrawGlyphRun (log-only)"
license = "GPL-3.0-or-later"

[[bin]]
name = "dwrite-probe"
path = "src/main.rs"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_DirectWrite",
  "Win32_System_Memory",
]
