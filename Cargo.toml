[workspace]
members = ["bootstrap"]
# Experimental Rust port of the C++ glyph-rendering core. Kept out of the main
# workspace: it links the FreeType fork lib produced by build-core.ps1 and is
# not part of the shipped product. Build it on its own from render-core/.
exclude = ["render-core", "render-inject", "hook-probe", "injector", "text-window", "dwrite-probe"]

[package]
name = "font-tuner"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Tray loader for MacType (replacement for the closed-source MacTray)"
repository = "https://github.com/zero-platform-Lab/font-tuner"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_System_WindowsProgramming",
]

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
