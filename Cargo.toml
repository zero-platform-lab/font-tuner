[workspace]
members = []
# Experimental Rust port of the C++ glyph-rendering core. Kept out of the main
# workspace: it links the FreeType fork lib produced by build-core.ps1 and is
# not part of the shipped product. Build it on its own from render-core/.
exclude = ["render-core", "render-inject", "loader"]

# Single source of truth for the shipped version: the exe and both DLLs embed
# it as a VERSIONINFO resource (build.rs), and build-msi.ps1 reads it for the
# MSI. Bump it for every release - Windows Installer replaces a versioned file
# only when the new version is higher.
[workspace.package]
version = "0.1.9"

[package]
name = "font-tuner"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Font rendering tuner for Windows (tray + RenderCore64 injector)"
repository = "https://github.com/zero-platform-Lab/font-tuner"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_Diagnostics_Debug",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Controls",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_HiDpi",
  "Win32_System_WindowsProgramming",
]

# The custom-profile dialog renders its preview with the same core the
# injected DLL uses (offline: no hooking). Links build/lib/freetype64.lib from
# build-core.ps1, which build-msi.ps1 runs first.
[dependencies.render-core]
path = "render-core"

[build-dependencies]
embed-resource = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints]
workspace = true

# Lints that catch C++ habits Rust can do without: `as` casts that silently
# truncate or drop the sign, `&x as *const _` and pointer-to-pointer `as`
# chains, unsafe fns whose whole body is treated as unsafe, unsafe blocks
# with no SAFETY note. check-lint.ps1 runs clippy and fails when a crate's
# warning count rises above clippy-baseline.txt; lower the baseline as the
# count drops.
[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic noise that says nothing about C++ habits
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
# beyond pedantic
undocumented_unsafe_blocks = "warn"
significant_drop_tightening = "warn"
