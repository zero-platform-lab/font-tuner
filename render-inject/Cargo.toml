[package]
name = "render-inject"
version = "0.1.0"
edition = "2021"
description = "Injected DLL that renders text with render-core (SKELETON ONLY — no hooking)"
license = "GPL-3.0-only"

[lib]
name = "RenderCore64"
crate-type = ["cdylib"]

[build-dependencies]
embed-resource = "3"

# The workspace sets these for the shipped binaries; this crate is outside it
# (it links the FreeType fork lib), so state them here. `panic = "abort"`
# matters: a panic must not unwind out of a detour - the `extern "system"`
# boundary aborts anyway, and this makes that explicit and drops the landing
# pads from a DLL that is mapped into every GUI process.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
render-core = { path = "../render-core" }
retour = "0.4.0-alpha.4"
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Threading",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_UI_WindowsAndMessaging",
]

# Lints that catch C++ habits Rust can do without: `as` casts that silently
# truncate or drop the sign, `&x as *const _` and pointer-to-pointer `as`
# chains, unsafe fns whose whole body is treated as unsafe, unsafe blocks
# with no SAFETY note. check-lint.ps1 runs clippy and fails when a crate's
# warning count rises above clippy-baseline.txt; lower the baseline as the
# count drops.
[lints.rust]
unsafe_op_in_unsafe_fn = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# pedantic noise that says nothing about C++ habits
doc_markdown = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
module_name_repetitions = "allow"
must_use_candidate = "allow"
similar_names = "allow"
# beyond pedantic
undocumented_unsafe_blocks = "warn"
significant_drop_tightening = "warn"
