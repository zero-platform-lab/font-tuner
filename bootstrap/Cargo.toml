[package]
name = "render-bootstrap"
version.workspace = true
edition = "2024"
license = "GPL-3.0-only"
description = "Child-process bootstrap that loads RenderCore64.dll (replacement for the closed-source upstream bootstrap)"
repository = "https://github.com/zero-platform-Lab/font-tuner"

[lib]
name = "RenderBootstrap64"
crate-type = ["cdylib"]

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_LibraryLoader",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
]

[build-dependencies]
embed-resource = "3"

[lints]
workspace = true
