[package]
name = "hook-probe"
version = "0.1.0"
edition = "2021"
description = "Stage 2: in-process ExtTextOutW interception, log-only (no injection, no output change)"
license = "GPL-3.0-or-later"

[[bin]]
name = "hook-probe"
path = "src/main.rs"

[dependencies]
minhook = "0.5"
render-core = { path = "../render-core" }
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_System_LibraryLoader",
]
