[package]
name = "d2d-probe"
version = "0.1.0"
edition = "2021"
description = "Intercept ID2D1RenderTarget::DrawGlyphRun (Direct2D path: WPF / native D2D)"
license = "GPL-3.0-only"

[[bin]]
name = "d2d-probe"
path = "src/main.rs"

[dependencies]
render-core = { path = "../render-core" }
windows-numerics = "0.3"
image = { version = "0.25", default-features = false, features = ["png"] }

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_Memory",
]
