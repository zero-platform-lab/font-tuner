[package]
name = "d2d-window"
version = "0.1.0"
edition = "2021"
description = "A Win32 window that draws glyph runs via Direct2D (ID2D1HwndRenderTarget::DrawGlyphRun) — an injection target for render-inject's D2D path"
license = "GPL-3.0-or-later"

[[bin]]
name = "d2d-window"
path = "src/main.rs"

[dependencies]
windows-numerics = "0.3"

[dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_LibraryLoader",
  "Win32_UI_WindowsAndMessaging",
]
